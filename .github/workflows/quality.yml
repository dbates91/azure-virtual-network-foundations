name: AD Help Desk — offline quality checks only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fictional identities, docs, and security boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax without running administration
        shell: pwsh
        run: |
          $paths = Get-ChildItem scripts/powershell -Filter *.ps1 -Recurse
          $errors = @()
          foreach ($file in $paths) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "Parsed $($paths.Count) PowerShell scripts. No AD connection or writes performed."

# Deliberately no Azure credentials, VM deployments, or Active Directory mutations.
